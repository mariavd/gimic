name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10"]
        os: [ubuntu-latest]
        # the suite must give the same results with one thread and several
        omp-threads: [1, 4]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

      # install Python and dependencies
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies
      run: pip install -r requirements.txt
    - name: Install OpenBLAS
      run: sudo apt-get install --yes libopenblas-dev

    - name: Build
      run: |
        ./setup
        cd build
        make
        make install
        OMP_NUM_THREADS=${{ matrix.omp-threads }} ctest --output-on-failure
