name: Test-debug

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10"]
        os: [ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

      # install Python and dependencies
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Build
      run: |
        # debug build without BLAS: covers the matmul fallback
        ./setup --no-blas --type=debug
        cd build
        make
        make install
        ctest --output-on-failure
